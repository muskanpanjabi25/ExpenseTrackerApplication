<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">💰 Expense Tracker</h3>
        <a class="btn btn-primary" th:href="@{/expenses/new}">+ Add Expense</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/}">
        <div class="col-auto"><input type="month" name="month" class="form-control" th:value="${month}"></div>
        <div class="col-auto"><button class="btn btn-outline-secondary">Filter</button></div>
    </form>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm"><div class="card-body">
                <div class="text-muted">Total for <span th:text="${month}"></span></div>
                <div class="fs-2 fw-bold" th:text="'₹ ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}"></div>
            </div></div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm"><div class="card-body">
                <div class="text-muted mb-2">By category</div>
                <span th:if="${byCategory.isEmpty()}" class="text-muted">No data</span>
                <span th:each="c : ${byCategory}" class="badge text-bg-secondary me-2 mb-1 fs-6"
                      th:text="${c.key} + ': ₹' + ${c.value}"></span>
            </div></div>
        </div>
    </div>

    <div class="card shadow-sm">
        <table class="table table-hover m-0">
            <thead><tr><th>Date</th><th>Title</th><th>Category</th><th class="text-end">Amount</th><th></th></tr></thead>
            <tbody>
            <tr th:if="${expenses.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">No expenses this month</td></tr>
            <tr th:each="e : ${expenses}">
                <td th:text="${e.date}"></td>
                <td><span th:text="${e.title}"></span><div class="small text-muted" th:text="${e.notes}"></div></td>
                <td><span class="badge text-bg-info" th:text="${e.category}"></span></td>
                <td class="text-end" th:text="'₹ ' + ${e.amount}"></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/expenses/{id}/edit(id=${e.id})}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{/expenses/{id}/delete(id=${e.id})}"
                          onsubmit="return confirm('Delete this expense?')">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
