<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:600px">
    <h4 class="mb-3" th:text="${expense.id == null} ? 'Add Expense' : 'Edit Expense'"></h4>
    <form class="card card-body shadow-sm" method="post" th:action="@{/expenses}" th:object="${expense}">
        <input type="hidden" th:field="*{id}">

        <label class="form-label">Title</label>
        <input class="form-control mb-1" th:field="*{title}">
        <div class="text-danger small mb-2" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

        <label class="form-label">Amount (₹)</label>
        <input type="number" step="0.01" class="form-control mb-1" th:field="*{amount}">
        <div class="text-danger small mb-2" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>

        <label class="form-label">Category</label>
        <select class="form-select mb-1" th:field="*{category}">
            <option value="">-- select --</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
        </select>
        <div class="text-danger small mb-2" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>

        <label class="form-label">Date</label>
        <input type="date" class="form-control mb-1" th:field="*{date}">
        <div class="text-danger small mb-2" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>

        <label class="form-label">Notes (optional)</label>
        <textarea class="form-control mb-3" rows="2" th:field="*{notes}"></textarea>

        <div class="d-flex gap-2">
            <button class="btn btn-primary">Save</button>
            <a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
